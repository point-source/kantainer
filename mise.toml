# Tooling for `just ci`. The same versions on the operator's machine and in CI,
# so a green gate locally means a green gate on a pull request.
#
# Install with: mise install

[tools]
just = "1.58.0"
hadolint = "2.15.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"
yamllint = "1.38.0"
cosign = "3.1.3"
