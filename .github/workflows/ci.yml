---
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: just ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Installs the tools pinned in mise.toml, so this gate runs the same
      # versions the operator runs locally.
      - name: Install tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0

      - name: just ci
        run: just ci

      # Separate from `just ci` because it reaches the network, which that gate
      # deliberately does not. This is what makes a Renovate pull request that
      # raised FCOS_VERSION without its checksum go red here rather than on the
      # operator's machine, after a 1.3 GB download.
      - name: Check the pinned Fedora CoreOS release against Fedora's metadata
        run: just check-installer-pin

      # The fixture contains public test credentials and deterministic output.
      # The macOS job compares its own render with these exact Linux bytes.
      - name: Produce Linux operator-host reference
        run: >-
          /bin/bash ./scripts/test-operator-config-compat.sh
          "${RUNNER_TEMP}/operator-config-linux"

      - name: Upload Linux operator-host reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: operator-config-linux
          path: ${{ runner.temp }}/operator-config-linux/
          if-no-files-found: error
          retention-days: 1

  macos_compat:
    name: macOS operator compatibility
    needs: ci
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The broad Linux gate owns the linters and installed-machine suite. The
      # Mac needs only the tools reached by config-check, render and flash.
      - name: Install focused tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          install_args: just aqua:coreos/butane

      - name: Download Linux operator-host reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: operator-config-linux
          path: ${{ runner.temp }}/operator-config-linux

      - name: Confirm supported stock Mac
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          [[ "$(uname -m)" == "arm64" ]]
          [[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" == "3.2" ]]

      - name: Test operator commands through built-in Bash
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          MACOS_COMPAT_ARTIFACTS: ${{ runner.temp }}/operator-config-macos
          MACOS_COMPAT_REFERENCE: ${{ runner.temp }}/operator-config-linux
        run: just test-macos-compat
