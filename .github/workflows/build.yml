---
name: Build and publish image

on:
  pull_request:
  push:
    branches:
      # The default branch. Publishing is gated on the `publish` step below,
      # which compares against the repository's actual default branch.
      - main
    paths-ignore:
      - '**.md'
  # Rebuilds pick up Fedora updates to the layered packages. Updates to the base
  # image itself arrive by bumping the pin in Containerfile and versions.env,
  # because the base is pinned by digest on purpose (SPEC.md
  # §spec:image-publication) - Renovate opens that pull request.
  schedule:
    - cron: '05 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a publish. Cancelling between the push and the signature would
  # leave a pushed but unsigned tag in the registry, which machines correctly
  # refuse - so they would silently stop updating until the next green build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e  # v9

      - name: Install tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0

      # A direct push to the default branch skips the pull request gate, and
      # publishing an unlinted image is not worth the seconds this saves.
      - name: just ci
        run: just ci

      # The publish decision, computed once. Every publishing step below tests
      # this output, so the security boundary is written in exactly one place.
      - name: Decide whether to publish
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" && "${REF}" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # IMAGE_REF comes from image.env, the same file the build reads when it
      # bakes the signing policy into the image. Pushing anywhere else would
      # publish an image whose policy names a repository it is not in.
      - name: Resolve image reference and tag
        run: |
          set -euo pipefail
          {
            echo "IMAGE_NAME=$(just image_name)"
            echo "IMAGE_REF=$(just image_ref)"
            echo "DEFAULT_TAG=$(just generate-default-tag)"
          } >> "$GITHUB_ENV"

      - name: Build image
        run: just build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # Smaller layers mean smaller nightly updates on the installed machine.
      - name: Rechunk
        run: just ostree-rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Generate build tags
        id: gen-build-tags
        run: |
          set -euo pipefail
          alias_tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Tags for this build: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "$GITHUB_OUTPUT"

      - name: Tag image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      # Everything below publishes. A pull request builds and stops here, so a
      # fork cannot publish under this project's name.
      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push-image
        if: steps.gate.outputs.publish == 'true'
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${tag}" "${IMAGE_REF}:${tag}"
          done
          echo "digest=$(< /tmp/digestfile)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.gate.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # The private key reaches cosign only as an environment variable read via
      # env://. It is never passed on argv, never written to the workspace,
      # never echoed, and no step with the key in scope runs `set -x`.
      #
      # --new-bundle-format=false is load-bearing. cosign 3 defaults to a
      # protobuf bundle that containers/image cannot read; the next step proves
      # the attachment is in the format the machine actually consumes.
      - name: Sign image
        if: steps.gate.outputs.publish == 'true'
        env:
          COSIGN_PASSWORD: ''
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}@${DIGEST}"

      # Catches a SIGNING_SECRET that does not match the cosign.pub this
      # repository ships and bakes into the image. That mismatch is silent at
      # signing time and would leave every installed machine unable to update.
      - name: Verify signature against cosign.pub
        if: steps.gate.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify --key cosign.pub "${IMAGE_REF}@${DIGEST}"

      # cosign verify reads both signature formats, so it cannot tell us the
      # machine can. containers/image - what bootc uses - reads only the legacy
      # attachment, published as a sha256-<digest>.sig tag. Pulling that tag is
      # the consumer-shaped check: if cosign ever writes a bundle instead,
      # signing and verifying both pass while every machine stops updating.
      - name: Confirm the signature is in the format machines read
        if: steps.gate.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          podman pull --quiet "${IMAGE_REF}:sha256-${DIGEST#sha256:}.sig" > /dev/null
