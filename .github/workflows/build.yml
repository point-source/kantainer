---
name: Build and publish image

on:
  pull_request:
  push:
    branches:
      # The default branch. Publishing happens only from here - see the
      # `publish` condition on the login, push and sign steps below.
      - main
    paths-ignore:
      - '**.md'
  # Rebuilds pick up Fedora updates to the layered packages. Updates to the base
  # image itself arrive by bumping the pin in Containerfile and versions.env,
  # because the base is pinned by digest on purpose (SPEC.md
  # §spec:image-publication) - Renovate opens that pull request.
  schedule:
    - cron: '05 10 * * *'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e  # v9

      - name: Install tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0

      # A direct push to the default branch skips the pull request gate, and
      # publishing an unlinted image is not worth the seconds this saves.
      - name: just ci
        run: just ci

      - name: Resolve image name and tag
        run: |
          echo "IMAGE_NAME=$(just image_name)" >> "$GITHUB_ENV"
          echo "DEFAULT_TAG=$(just generate-default-tag)" >> "$GITHUB_ENV"

      - name: Build image
        run: just build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # Smaller layers mean smaller nightly updates on the installed machine.
      - name: Rechunk
        run: just ostree-rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Generate build tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Tags for this build: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "$GITHUB_OUTPUT"

      - name: Tag image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      # Everything below publishes. A pull request builds and stops here, so a
      # fork cannot publish under this project's name.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          registry="${IMAGE_REGISTRY,,}"
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${tag}" "${registry}/${IMAGE_NAME}:${tag}"
          done
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "digest=$(< /tmp/digestfile)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # The private key reaches cosign only as an environment variable read via
      # env://. It is never written to the workspace, never echoed, and no step
      # here runs with `set -x`.
      #
      # --new-bundle-format=false is load-bearing. cosign 3 defaults to the
      # protobuf bundle format, which containers/image cannot read, so the
      # signature would be written successfully and then be invisible to every
      # machine trying to verify an update.
      - name: Sign image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          REGISTRY: ${{ steps.push-image.outputs.registry }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # cosign's own verdict on whether the signature it just wrote can be read
      # back with the public key this repository ships and bakes into the image.
      # Catches a SIGNING_SECRET that does not match cosign.pub, and a signature
      # written in a format nothing can verify. Both failures are silent at
      # signing time and would leave every installed machine unable to update.
      - name: Verify signature against cosign.pub
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REGISTRY: ${{ steps.push-image.outputs.registry }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify --key cosign.pub "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
