# Portainer's settings, its certificate and the definitions of anything the
# operator deploys through it (SPEC.md §spec:portainer-service).
#
# Created here rather than in the build because content baked into /var is
# unpacked only from the *initial* image and is never re-applied afterwards -
# a directory made at build time would be missing from any machine that
# installed a later image. systemd-tmpfiles runs on every boot, so this also
# restores the directory if it is ever removed.
#
# /var is shared across bootc deployments, so this survives reboots and OS
# updates - and rollbacks, which means rolling the OS back does not roll
# Portainer's database back with it.
#
# The login screen's kantainer block (SPEC.md §spec:console-display).
#
# agetty reads its snippets from /etc/issue.d, which is why the platform writes
# there - and /etc is persistent, so a snippet outlives the network it
# described. A machine moved to another network, or booted with the cable out,
# would show the last address it ever had until the generator next ran. That is
# precisely the stale address §req:success-criteria 20 forbids, and it would be
# on screen during the one window - early boot - when an operator is most likely
# to be standing in front of the machine.
#
# systemd-tmpfiles runs well before kantainer-console-network.service, so the
# screen falls back to the platform's own lines rather than to a wrong one. The
# base image does exactly this for its own snippets with `r
# /etc/issue.d/*_clhm_*.issue`; this is the same rule for our marker.
#
# The glob covers the whole marker, not one filename: the Portainer half of
# §spec:console-display (batch 3) writes 91_kantainer_portainer.issue beside
# ours and needs no change here.
#
#Type Path                             Mode UID  GID  Age Argument
d     /var/lib/portainer               0700 root root -
r     /etc/issue.d/*_kantainer_*.issue -    -    -    -
