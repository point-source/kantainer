# Put Portainer's own starts and stops on the login screen
# (SPEC.md §spec:console-display).
#
# §spec:console-display: "Portainer starting, stopping or failing are all
# reflected on the screen without a reboot and without anyone logging in". The
# probe's timer gets there within a minute on its own, but the operator who just
# restarted Portainer is watching the screen now, and a minute of a stale
# service line is a minute of the screen disagreeing with the machine for no
# reason. This is the same seam batch 2 used for network events: the thing that
# KNOWS the state changed is the thing that says so.
#
# Only the service line moves. The port line still shows the last probe's answer
# with the last probe's timestamp, which is correct and is the whole reason that
# timestamp is on the screen - the two statements are independent, and
# invalidating one from the other's event would be choosing between them.
#
# NOTHING HERE MAY AFFECT PORTAINER. The `-` prefix makes systemd ignore the
# result, so a broken renderer cannot fail Portainer's start; --no-block means
# it is not waited on. `restart` rather than `start` because systemd satisfies a
# start request with a job that is already queued, so a burst - which a crash
# loop is - could drop the last one.

# OnFailure= IS NOT REDUNDANT WITH ExecStopPost= BELOW, though it reads that way.
# ExecStopPost runs when the service stops, which covers a Portainer that died.
# It does NOT run when systemd REFUSES the start outright - which is what happens
# once Portainer trips StartLimitBurst=3, the moment it has given up for good and
# the service line most needs to reach the screen. Only OnFailure fires there.
# Delete it and the screen keeps saying "activating" on a machine that has
# stopped trying.

[Unit]
OnFailure=kantainer-console-portainer.service

[Service]
ExecStartPost=-/usr/bin/systemctl restart --no-block kantainer-console-portainer.service
ExecStopPost=-/usr/bin/systemctl restart --no-block kantainer-console-portainer.service
