# When the machine updates itself (SPEC.md §spec:os-updates).
#
# The base image ships this timer already written and already correct - it runs
# `bootc upgrade --apply`, which fetches the new published image, stages it and
# reboots the machine. It is simply not switched on, and its schedule is built
# for fleets rather than for one machine in a house. build.sh enables it; this
# file gives it the overnight schedule §req:quality-attributes asks for.
#
# THE TWO BLANK LINES ARE THE POINT. systemd ACCUMULATES timer triggers across
# drop-ins - a drop-in that only added OnCalendar= would leave the base image's
# OnBootSec=1h and OnUnitInactiveSec=8h in place, and the machine would also
# reboot an hour after every boot and every eight hours after that, in the
# middle of the day. Assigning the empty string is how a list directive is
# cleared. scripts/test-updates.sh asserts both are here.
#
# RandomizedDelaySec is set rather than inherited for the same reason: the base
# image spreads by 2h, which from 03:00 reaches 05:00. One hour keeps the whole
# window inside 03:00-04:00. The spread exists so that a registry does not take
# every machine's request at the same instant; with one machine it costs
# nothing to keep.
#
# Persistent= is deliberately left at its default of false. Persistent=true
# replays a missed window at the next boot, so a machine that was switched off
# overnight would reboot itself in the middle of the operator's day - the one
# thing §req:quality-attributes rules out. A missed night is picked up the next
# night.

[Timer]
OnBootSec=
OnUnitInactiveSec=
OnCalendar=*-*-* 03:00:00
RandomizedDelaySec=1h
