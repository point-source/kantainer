# Run the boot health check after Docker has actually started
# (SPEC.md §spec:boot-health-and-rollback).
#
# WITHOUT THIS THE CHECK IS WRONG IN THE STRICT DIRECTION, which this section
# says is worse than having no check at all.
#
# greenboot-healthcheck.service carries no After= of its own - its only ordering
# is the implicit After=basic.target - and it is WantedBy=multi-user.target.
# docker.service is also WantedBy=multi-user.target, which orders neither
# against the other, and it waits on network-online.target before it even
# starts. So the check runs first on essentially every boot, reads
# `systemctl is-active docker.service` as inactive, and calls the boot red.
#
# On an ordinary boot that is a false red. On the boot after an update - the one
# where greenboot has armed the counter - it is reboot, reboot, and then a
# rollback of a perfectly good update, over and over, while the machine quietly
# stops receiving fixes. That is the exact failure §spec:boot-health-and-rollback
# describes as the one nobody would notice.
#
# After= alone, deliberately NOT Requires=. If Docker genuinely fails to start,
# the ordering is still satisfied - a failed job still completes - so the check
# runs and honestly reports the boot red, which is what should happen. Requires=
# would instead cancel the check and lose the signal.
#
# docker.service is Type=notify, so this waits for the daemon to report itself
# ready, not merely for the job to be queued.
#
# Nothing above Docker is named here, and nothing should be: the check does not
# test Portainer, and ordering it after Portainer would smuggle Portainer back
# into the health verdict through the back door.

[Unit]
After=docker.service
