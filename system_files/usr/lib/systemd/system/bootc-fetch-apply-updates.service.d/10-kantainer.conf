# Ordering for the nightly update (SPEC.md §spec:os-updates).
#
# The base image's unit carries no network ordering at all. A machine that boots
# shortly before the window - after a power cut, say - would spend its single
# nightly attempt on a network that is not up yet, fail, and try again in 24
# hours. The base image's own rpm-ostreed-automatic.timer orders itself this way
# for the same reason.

[Unit]
Wants=network-online.target
After=network-online.target

# Refuse to update at all unless this machine verifies signatures
# (SPEC.md §spec:os-updates). bootc does not consult the baked signing policy
# unless the machine was attached with --enforce-container-sigpolicy, so this
# asks bootc which mode it is in and fails the unit if the answer is wrong.
# A machine that stops updating says so; one that updates unsigned does not.

[Service]
ExecStartPre=/usr/libexec/kantainer/update-preflight
