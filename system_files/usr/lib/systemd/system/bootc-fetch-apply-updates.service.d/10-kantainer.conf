# Ordering for the nightly update (SPEC.md §spec:os-updates).
#
# The base image's unit carries no network ordering at all. A machine that boots
# shortly before the window - after a power cut, say - would spend its single
# nightly attempt on a network that is not up yet, fail, and try again in 24
# hours. The base image's own rpm-ostreed-automatic.timer orders itself this way
# for the same reason.

[Unit]
Wants=network-online.target
After=network-online.target
